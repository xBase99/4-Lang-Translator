<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="docTitle">Auto Lang TTS & Translator v1.01</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --highlight: #dbeafe;
            --highlight-border: #2563eb;
            --tag-en-bg: #e0e7ff;
            --tag-en-color: #3730a3;
            --tag-ko-bg: #fef3c7;
            --tag-ko-color: #92400e;
            --tag-zh-bg: #dcfce7;
            --tag-zh-color: #166534;
            --tag-de-bg: #f3e8ff;
            --tag-de-color: #6b21a8;
            --record-bg: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        /* 모바일 풀 스크린 자동 맞춤 */
        .container {
            width: 100%;
            max-width: 600px;
            min-height: 100dvh;
            background: var(--card-bg);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        @media (min-width: 600px) {
            body { padding: 1rem 0; }
            .container {
                min-height: auto;
                border-radius: 16px;
                border: 1px solid var(--border);
            }
        }

        .mobile-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
        }

        .mobile-header-bar h1 { font-size: 1.35rem; font-weight: 800; }
        .header-btn-group { display: flex; gap: 0.5rem; }

        .btn-icon {
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            font-weight: 700;
            background-color: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .log-status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
        }

        .status-tag {
            font-size: 0.8rem;
            font-weight: 800;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            color: white;
        }
        .status-tag.on { background-color: #16a34a; }
        .status-tag.off { background-color: #94a3b8; }

        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        label { font-weight: 700; font-size: 0.95rem; }

        .stt-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .btn-stt {
            padding: 0.75rem 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 0.85rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.5;
            outline: none;
            resize: vertical;
        }

        .photo-trans-bar { margin-top: 0.75rem; margin-bottom: 1rem; }
        .btn-photo {
            display: block;
            text-align: center;
            padding: 0.8rem;
            background-color: #4f46e5;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        .ocr-status-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: #2563eb;
            margin-top: 0.4rem;
            text-align: center;
        }

        .controls, .rec-controls {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem;
            margin-bottom: 1rem;
        }

        .main-controls { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 0.4rem; }
        .btn-large { padding: 0.75rem 0.4rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; }

        .btn-primary { background-color: var(--primary); color: white; border: none; border-radius: 8px; }
        .btn-secondary { background-color: white; color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
        .btn-danger { background-color: var(--record-bg); color: white; border: none; border-radius: 8px; }

        .rate-control { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; font-size: 0.9rem; font-weight: 700; }
        .rate-control input { flex: 1; }

        .rec-controls .btn-group { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .rec-controls .btn-group button { flex: 1; padding: 0.65rem; font-weight: 700; }

        .list-header-row { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
        .scroll-control-group { display: flex; gap: 0.4rem; }

        .btn-scroll {
            flex: 1;
            padding: 0.5rem 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            background: white;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-scroll.highlight { background: var(--primary); color: white; }

        .scrollable-sentence-box {
            max-height: 260px;
            overflow-y: auto;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        .sentence-card {
            padding: 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 0.6rem;
            background: #f8fafc;
        }

        .sentence-card.active {
            background-color: var(--highlight);
            border: 2px solid var(--highlight-border);
        }

        .sentence-text { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
        .translation-block { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--border); }
        .translation-text { font-size: 1rem; color: #1e293b; line-height: 1.4; }

        .single-play-group { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .btn-lang-play {
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 700;
            background-color: #eff6ff;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            cursor: pointer;
        }

        .play-single-btn { background: transparent; border: none; font-size: 1.2rem; color: var(--primary); cursor: pointer; }

        .lang-tag { font-size: 0.75rem; font-weight: 800; padding: 0.2rem 0.4rem; border-radius: 4px; }
        .lang-tag.en { background: var(--tag-en-bg); color: var(--tag-en-color); }
        .lang-tag.ko { background: var(--tag-ko-bg); color: var(--tag-ko-color); }
        .lang-tag.zh { background: var(--tag-zh-bg); color: var(--tag-zh-color); }
        .lang-tag.de { background: var(--tag-de-bg); color: var(--tag-de-color); }

        .trip-affiliate-card {
            margin-top: 1rem; padding: 0.85rem;
            background: linear-gradient(135deg, #287dfa 0%, #1052c5 100%);
            border-radius: 12px; color: white; display: flex; flex-direction: column; gap: 0.6rem; text-align: center;
        }

        .btn-trip { background-color: #ff9500; color: white; text-decoration: none; font-weight: 700; padding: 0.65rem; border-radius: 8px; }
        footer { margin-top: auto; padding-top: 1rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 92%;
            max-width: 480px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .close-btn { font-size: 1.8rem; cursor: pointer; }
        .modal-body { padding: 1rem 0; overflow-y: auto; flex: 1; }

        .setting-item { margin-bottom: 1.1rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .setting-item.horizontal { flex-direction: row; justify-content: space-between; align-items: center; }

        .large-select { padding: 0.75rem; font-size: 1rem; font-weight: 700; border-radius: 8px; border: 1px solid var(--border); background: white; }

        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.3s; border-radius:26px; }
        .slider:before { position: absolute; content:""; height:20px; width:20px; left:3px; bottom:3px; background:white; transition:.3s; border-radius:50%; }
        input:checked + .slider { background: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<div class="container">
    <!-- 헤더 -->
    <div class="mobile-header-bar">
        <h1 id="uiTitle">🗣️ 4개국어 번역기</h1>
        <div class="header-btn-group">
            <button id="btnOpenSettings" class="btn-icon">⚙️ <span id="uiBtnSettings">설정</span></button>
            <button id="btnManageLogs" class="btn-icon">📜 <span id="uiBtnLogs">기록</span></button>
        </div>
    </div>

    <!-- 상태 알림 바 -->
    <div class="log-status-bar">
        <span id="uiLogModeLabel">📝 자동 대화 기록 모드:</span>
        <span id="logModeStatus" class="status-tag off">OFF</span>
    </div>

    <!-- 입력 영역 -->
    <div class="input-group">
        <div class="label-row">
            <label for="inputText" id="uiLabelInput">연습할 문장 입력 (큰 글씨 지원):</label>
            <button id="btnClear" class="btn-secondary" style="padding: 0.25rem 0.6rem; font-weight:700;">🗑️ <span id="uiBtnClear">지우기</span></button>
        </div>

        <div class="stt-btn-grid">
            <button id="btnSTTEn" class="btn-stt">🎤 English</button>
            <button id="btnSTTKo" class="btn-stt">🎤 한국어</button>
            <button id="btnSTTZh" class="btn-stt">🎤 中文</button>
            <button id="btnSTTDe" class="btn-stt">🎤 Deutsch</button>
        </div>

        <textarea id="inputText" placeholder=""></textarea>

        <!-- 사진 번역 -->
        <div class="photo-trans-bar">
            <label for="imageInput" class="btn-photo" id="uiBtnPhoto">📷 사진 속 글자 읽기 및 번역</label>
            <input type="file" id="imageInput" accept="image/*" style="display:none;">
            <div id="ocrStatus" class="ocr-status-text"></div>
        </div>
    </div>

    <!-- 컨트롤 -->
    <div class="controls">
        <div class="btn-group main-controls">
            <button id="btnPlay" class="btn-primary btn-large">▶ 전체 읽기</button>
            <button id="btnPause" class="btn-secondary btn-large">⏸️ 일시정지</button>
            <button id="btnStop" class="btn-secondary btn-large">⏹️ 정지</button>
        </div>

        <div class="rate-control">
            <label for="rate" id="uiLabelSpeed">읽기 속도:</label>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1.0">
            <span id="rateValue">1.0x</span>
        </div>
    </div>

    <!-- 녹음 영역 -->
    <div class="rec-controls">
        <div class="btn-group">
            <button id="btnRecStart" class="btn-danger">🎙️ 내 발음 녹음 시작</button>
            <button id="btnRecStop" class="btn-secondary" disabled>⏹️ 녹음 정지</button>
        </div>
        <audio id="audioPlayback" controls style="display:none; width:100%; margin-top:0.5rem;"></audio>
        <a id="btnDownload" class="btn-primary" style="display:none; text-decoration:none; text-align:center; padding:0.5rem; border-radius:8px; margin-top:0.5rem; font-weight:700;">💾 녹음 저장</a>
    </div>

    <!-- 목록 및 스크롤 -->
    <div class="sentences-container">
        <div class="list-header-row">
            <label id="uiLabelList">분석 및 번역 문장 목록:</label>
            <div class="scroll-control-group">
                <button id="btnScrollPrev" class="btn-scroll">▲ <span id="uiBtnPrev">이전 줄</span></button>
                <button id="btnScrollNext" class="btn-scroll">▼ <span id="uiBtnNext">다음 줄</span></button>
                <button id="btnAutoScrollToggle" class="btn-scroll highlight">🔄 <span id="uiBtnAutoScroll">연속 넘김</span></button>
            </div>
        </div>

        <div id="sentenceList" class="scrollable-sentence-box"></div>
    </div>

    <!-- Trip.com 제휴 카드 -->
    <div class="trip-affiliate-card">
        <div class="trip-info">
            <h4 id="uiTripTitle">✈️ Trip.com 특별 제휴 혜택</h4>
            <p id="uiTripDesc">전 세계 호텔, 항공권을 최저가로 예약하세요!</p>
        </div>
        <a href="https://www.trip.com/t/77sfZ47lEW2" target="_blank" rel="noopener noreferrer" class="btn-trip" id="uiTripBtn">
            Trip.com 바로가기 ➔
        </a>
    </div>

    <footer>
        <p>Web Speech API & Google Translate | v1.01 | (c) Evergreen 2026</p>
    </footer>
</div>

<!-- ================= [모달 1: 환경설정] ================= -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="uiModalSettingsTitle">⚙️ 환경 설정 (옵션)</h3>
            <span id="closeSettingsModal" class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label id="uiLangLabel">🌐 메뉴 언어 선택:</label>
                <select id="uiLangSelect" class="large-select">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">English</option>
                    <option value="zh">中文 (Chinese)</option>
                    <option value="de">Deutsch (German)</option>
                </select>
            </div>

            <div class="setting-item horizontal">
                <span id="uiLabelShowTrans">번역문 화면 표시:</span>
                <label class="switch">
                    <input type="checkbox" id="toggleTrans" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item horizontal">
                <span id="uiLabelSingleMode">🔂 문장별 단독 재생 (자동 넘김 방지):</span>
                <label class="switch">
                    <input type="checkbox" id="toggleSingleMode">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <label id="uiLabelTransLang1">번역 언어 1:</label>
                <select id="transLangSelect1" class="large-select">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">English</option>
                    <option value="zh">中文 (Chinese)</option>
                    <option value="de">Deutsch (German)</option>
                </select>
            </div>

            <div class="setting-item">
                <label id="uiLabelTransLang2">번역 언어 2:</label>
                <select id="transLangSelect2" class="large-select">
                    <option value="en">English</option>
                    <option value="ko">한국어 (Korean)</option>
                    <option value="zh">中文 (Chinese)</option>
                    <option value="de">Deutsch (German)</option>
                    <option value="none">사용 안 함 (None)</option>
                </select>
            </div>

            <div class="setting-item horizontal">
                <span id="uiLabelAutoLogMode">📝 대화 자동 기록 모드:</span>
                <label class="switch">
                    <input type="checkbox" id="toggleLogMode">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btnSaveSettings" class="btn-primary btn-large" style="width:100%;">설정 완료 및 닫기</button>
        </div>
    </div>
</div>

<!-- ================= [모달 2: 대화 기록 보관함] ================= -->
<div id="logModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="uiModalLogsTitle">📜 대화 기록 보관함</h3>
            <span id="closeLogModal" class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div id="logHistoryList"></div>
        </div>
        <div class="modal-footer" style="display:flex; gap:0.4rem; flex-wrap:wrap;">
            <button id="btnExportLogs" class="btn-secondary" style="flex:1; padding:0.6rem;">💾 백업</button>
            <button id="btnImportLogs" class="btn-secondary" style="flex:1; padding:0.6rem;">📁 열기</button>
            <input type="file" id="logFileInput" accept=".json" style="display: none;">
            <button id="btnClearAllLogs" class="btn-danger" style="flex:1; padding:0.6rem;">🗑️ 삭제</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" async></script>
<script>
// --- [보안 모듈] ---
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && [85, 83].includes(e.keyCode))) {
        e.preventDefault(); return false;
    }
});

        await worker.terminate();

        const text = ret.data.text.trim();
        if (text) {

function getLocalLogs() { return JSON.parse(localStorage.getItem('app_dialogue_logs') || '[]'); }
function saveLocalLogs(logs) { localStorage.setItem('app_dialogue_logs', JSON.stringify(logs)); }

function appendToCurrentLog(text, sourceLang) {
    if (!isLogModeOn || !text.trim()) return;
    let logs = getLocalLogs();
    const today = new Date().toISOString().split('T')[0];
    let todayLog = logs.find(item => item.date === today);

    if (!todayLog) {
        todayLog = { id: Date.now(), date: today, entries: [] };
        logs.push(todayLog);
    }

    todayLog.entries.push({ time: new Date().toLocaleTimeString(), sourceLang, text });
    saveLocalLogs(logs);
}

});

function renderLogHistory() {
    const logs = getLocalLogs();
    const logHistoryList = document.getElementById('logHistoryList');
    logHistoryList.innerHTML = '';

    if (logs.length === 0) {
        logHistoryList.innerHTML = '<p style="text-align:center; color:#64748b; padding:1rem;">No Records.</p>';
        return;
    }

    logs.forEach((logItem, index) => {
        const itemCard = document.createElement('div');
        itemCard.style.cssText = "background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:0.8rem; margin-bottom:0.75rem;";
        let entriesHtml = logItem.entries.map(e => `<div>• <b>[${e.time}] (${e.sourceLang}):</b> ${e.text}</div>`).join('');

        itemCard.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.85rem; color:#475569;">
                <span><b>📅 ${logItem.date}</b> (${logItem.entries.length})</span>
                <div>
                    <button onclick="loadLogToInput(${index})" style="padding:0.2rem 0.5rem;">Load</button>
                    <button onclick="deleteSingleLog(${index})" style="padding:0.2rem 0.5rem; background:#dc2626; color:white; border:none; border-radius:4px;">Del</button>
                </div>
            </div>
            <div style="font-size:0.88rem; max-height:100px; overflow-y:auto; background:white; padding:0.5rem; border-radius:4px;">
                ${entriesHtml}
            </div>
        `;
        logHistoryList.appendChild(itemCard);
    });
}

let sentences = [];
let currentIndex = 0;
let isPlaying = false;
let synth = window.speechSynthesis;
let voices = [];
let mediaRecorder = null;
let audioChunks = [];

const regEnglish = /[a-zA-Z]/;
const regKorean = /[\u3131-\u318E\uAC00-\uD7A3]/;
const regChinese = /[\u4E00-\u9FFF\u3400-\u4DBF\uF900-\uFAFF]/;
const regGerman = /[äöüÄÖÜß]/;

function detectLanguage(text) {
    if ((text.match(new RegExp(regGerman, 'g')) || []).length > 0) return 'de';
    const enCount = (text.match(new RegExp(regEnglish, 'g')) || []).length;
    const koCount = (text.match(new RegExp(regKorean, 'g')) || []).length;
    const zhCount = (text.match(new RegExp(regChinese, 'g')) || []).length;

    if (enCount > 0 && enCount >= koCount && enCount >= zhCount) return 'en';
    if (zhCount > 0 && zhCount >= koCount) return 'zh';
    if (koCount > 0) return 'ko';
    return 'en';
}

function loadVoices() { voices = synth.getVoices(); }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function getBestVoice(langCode) {
    if (!voices || voices.length === 0) voices = synth.getVoices();
    const langMap = { 'en': 'en-US', 'ko': 'ko-KR', 'zh': 'zh-CN', 'de': 'de-DE' };
    const target = langMap[langCode] || 'en-US';
    let matched = voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(target.toLowerCase()));
    if (langCode === 'zh' && matched.length === 0) matched = voices.filter(v => v.lang.toLowerCase().startsWith('zh'));
    const best = matched.find(v => v.name.includes('Natural') || v.name.includes('Online') || v.name.includes('Google'));
    return best || matched[0] || null;
}

async function translateText(text, targetLang) {
    if (!targetLang || targetLang === 'none') return "";
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
    } catch (e) { return ""; }
}

function parseSentences(text) {
    if (!text.trim()) return [];
    const rawSegments = text.split(/(?<=[.!?;\n。！？；])\s+/);
    let parsed = [];

    for (let seg of rawSegments) {
        seg = seg.trim();
        if (!seg) continue;
        const chunks = seg.match(/([a-zA-ZäöüÄÖÜß0-9\s'\",.-]+|[\u4E00-\u9FFF\u3400-\u4DBF\uF900-\uFAFF\s，。！？；“”‘’]+|[\uAC00-\uD7A3\u3131-\u318E\s]+|[^a-zA-Z0-9\uAC00-\uD7A3\u3131-\u318E\u4E00-\u9FFF]+)/g) || [seg];
        let tempGroup = "";
        let lastLang = null;

        for (let chunk of chunks) {
            if (!chunk.trim()) continue;
            let lang = detectLanguage(chunk);
            if (lastLang === null || lastLang === lang) tempGroup += chunk;
            else {
                if (tempGroup.trim()) parsed.push(createSentenceObj(tempGroup.trim(), lastLang));
                tempGroup = chunk;
            }
            lastLang = lang;
        }
        if (tempGroup.trim()) parsed.push(createSentenceObj(tempGroup.trim(), lastLang));
    }
    return parsed;
}

function createSentenceObj(text, langCode) {
    const langMap = { 'en': 'en-US', 'ko': 'ko-KR', 'zh': 'zh-CN', 'de': 'de-DE' };
    return { text, langCode, lang: langMap[langCode], translation1: '', translation2: '' };
}

async function renderSentences() {
    sentences = parseSentences(inputText.value);
    
    const showTrans = toggleTrans ? toggleTrans.checked : true;
    const isSingleMode = toggleSingleMode ? toggleSingleMode.checked : false;
    const targetLang1 = transLangSelect1.value;
    const targetLang2 = transLangSelect2.value;

    if (showTrans) {
        await Promise.all(sentences.map(async (item) => {
            if (targetLang1 !== item.langCode) item.translation1 = await translateText(item.text, targetLang1);
            if (targetLang2 !== 'none' && targetLang2 !== item.langCode) item.translation2 = await translateText(item.text, targetLang2);
        }));
    }

    const fragment = document.createDocumentFragment();

    for (let index = 0; index < sentences.length; index++) {
        const item = sentences[index];
        const card = document.createElement('div');
        card.className = `sentence-card ${index === currentIndex && isPlaying ? 'active' : ''}`;
        card.id = `card-${index}`;

        let tagLabel = langRes.tagEn;
        if (item.langCode === 'ko') tagLabel = langRes.tagKo;
        if (item.langCode === 'zh') tagLabel = langRes.tagZh;
        if (item.langCode === 'de') tagLabel = langRes.tagDe;

        let trans1Tag = langRes[`tag${targetLang1.charAt(0).toUpperCase() + targetLang1.slice(1)}`] || targetLang1;
        let trans2Tag = langRes[`tag${targetLang2.charAt(0).toUpperCase() + targetLang2.slice(1)}`] || targetLang2;

        let playControlsHtml = isSingleMode ? `
            <div class="single-play-group">
                <button class="btn-lang-play" onclick="playSingleLanguageText('${encodeURIComponent(item.text)}', '${item.langCode}')">🔊 ${tagLabel}</button>
                ${item.translation1 ? `<button class="btn-lang-play" onclick="playSingleLanguageText('${encodeURIComponent(item.translation1)}', '${targetLang1}')">🔊 ${trans1Tag}</button>` : ''}
                ${item.translation2 ? `<button class="btn-lang-play" onclick="playSingleLanguageText('${encodeURIComponent(item.translation2)}', '${targetLang2}')">🔊 ${trans2Tag}</button>` : ''}
            </div>
        ` : `<button class="play-single-btn" onclick="playSingle(${index})">▶</button>`;

        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="sentence-text">${item.text}</div>
                <div>
                    <span class="lang-tag ${item.langCode}">${tagLabel}</span>
                    ${!isSingleMode ? playControlsHtml : ''}
                </div>
            </div>
            ${showTrans ? `
                <div class="translation-block">
                    ${item.translation1 ? `<div class="translation-text">💬 <b>${trans1Tag}:</b> ${item.translation1}</div>` : ''}
                    ${item.translation2 ? `<div class="translation-text">💬 <b>${trans2Tag}:</b> ${item.translation2}</div>` : ''}
                </div>
            ` : ''}
            ${isSingleMode ? playControlsHtml : ''}
        `;
        fragment.appendChild(card);
    }

    sentenceList.innerHTML = '';
    sentenceList.appendChild(fragment);
}

window.playSingleLanguageText = function(encodedText, langCode) {
    const text = decodeURIComponent(encodedText);
    synth.cancel();

    const langMap = { 'en': 'en-US', 'ko': 'ko-KR', 'zh': 'zh-CN', 'de': 'de-DE' };
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langMap[langCode] || 'en-US';
    utterance.rate = parseFloat(rateInput.value);

    const voice = getBestVoice(langCode);
    if (voice) utterance.voice = voice;

    synth.speak(utterance);
};

function updateActiveCard(index) {
    document.querySelectorAll('.sentence-card').forEach((card, i) => {
        if (i === index) {
            card.classList.add('active');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else { card.classList.remove('active'); }
    });
}

async function playNative(index) {
    if (index >= sentences.length || !isPlaying) {
        isPlaying = false; updateActiveCard(-1); btnPlay.textContent = langRes.btnPlay; return;
    }

    synth.cancel();
    currentIndex = index;
    const current = sentences[currentIndex];
    updateActiveCard(currentIndex);

    const showTrans = toggleTrans ? toggleTrans.checked : true;
    const targetLang1 = transLangSelect1.value;
    const targetLang2 = transLangSelect2.value;
    const langMap = { 'en': 'en-US', 'ko': 'ko-KR', 'zh': 'zh-CN', 'de': 'de-DE' };

    const origUtterance = new SpeechSynthesisUtterance(current.text);
    origUtterance.lang = current.lang;
    origUtterance.rate = parseFloat(rateInput.value);
    const origVoice = getBestVoice(current.langCode);
    if (origVoice) origUtterance.voice = origVoice;

    let queue = [origUtterance];

    if (showTrans) {
        if (current.translation1) {
            const u1 = new SpeechSynthesisUtterance(current.translation1);
            u1.lang = langMap[targetLang1];
            u1.rate = parseFloat(rateInput.value);
            const v1 = getBestVoice(targetLang1);
            if (v1) u1.voice = v1;
            queue.push(u1);
        }
        if (current.translation2) {
            const u2 = new SpeechSynthesisUtterance(current.translation2);
            u2.lang = langMap[targetLang2];
            u2.rate = parseFloat(rateInput.value);
            const v2 = getBestVoice(targetLang2);
            if (v2) u2.voice = v2;
            queue.push(u2);
        }
    }

    const lastUtterance = queue[queue.length - 1];
    lastUtterance.onend = () => { if (isPlaying) { currentIndex++; playNative(currentIndex); } };
    lastUtterance.onerror = () => { if (isPlaying) { currentIndex++; playNative(currentIndex); } };

    queue.forEach(u => synth.speak(u));
}

function startPlayback() {
    if (sentences.length === 0) return;
    if (synth.paused) { synth.resume(); isPlaying = true; btnPlay.textContent = langRes.btnPlayActive; return; }
    if (isPlaying) return;
    isPlaying = true;
    btnPlay.textContent = langRes.btnPlayActive;
    playNative(currentIndex);
}

function pausePlayback() { if (synth.speaking && !synth.paused) { synth.pause(); isPlaying = false; btnPlay.textContent = langRes.btnResume; } }
function stopPlayback() { synth.cancel(); isPlaying = false; currentIndex = 0; btnPlay.textContent = langRes.btnPlay; updateActiveCard(-1); }

window.playSingle = function(index) { stopPlayback(); isPlaying = true; btnPlay.textContent = langRes.btnPlayActive; playNative(index); };

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function startSpeechRecognition(langMode, btnElement, sourceLangName) {
    if (!SpeechRecognition) { alert(langRes.errNoSTT); return; }
    const recognition = new SpeechRecognition();
    recognition.lang = langMode;
    recognition.interimResults = false;

    try { recognition.start(); btnElement.style.opacity = '0.7'; } catch (e) { recognition.stop(); }

    recognition.onresult = async (event) => {
        const spokenText = event.results[0][0].transcript;
        inputText.value = inputText.value ? `${inputText.value}\n\n${spokenText}` : spokenText;

        appendToCurrentLog(spokenText, sourceLangName);
        resetSTTButtons();
        stopPlayback();
        saveCurrentState();
        await renderSentences();
    };

    recognition.onerror = () => { alert(langRes.errMic); resetSTTButtons(); };
    recognition.onend = () => resetSTTButtons();
}

function resetSTTButtons() {
    btnSTTEn.style.opacity = '1.0';
    btnSTTKo.style.opacity = '1.0';
    btnSTTZh.style.opacity = '1.0';
    btnSTTDe.style.opacity = '1.0';
}

btnSTTEn.addEventListener('click', () => startSpeechRecognition('en-US', btnSTTEn, 'EN'));
btnSTTKo.addEventListener('click', () => startSpeechRecognition('ko-KR', btnSTTKo, 'KO'));
btnSTTZh.addEventListener('click', () => startSpeechRecognition('zh-CN', btnSTTZh, 'ZH'));
btnSTTDe.addEventListener('click', () => startSpeechRecognition('de-DE', btnSTTDe, 'DE'));

btnRecStart.addEventListener('click', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert(langRes.errMic); return; }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            audioPlayback.src = audioUrl; audioPlayback.style.display = 'block';
            btnDownload.href = audioUrl;
            btnDownload.download = `voice_${Date.now()}.webm`;
            btnDownload.style.display = 'block';
        };
        mediaRecorder.start();
        btnRecStart.disabled = true; btnRecStop.disabled = false;
        btnRecStart.textContent = langRes.btnRecRecording;
    } catch (err) { alert(langRes.errMic); }
});

btnRecStop.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop());
        btnRecStart.disabled = false; btnRecStop.disabled = true;
        btnRecStart.textContent = langRes.btnRecStart;
    }
});

inputText.addEventListener('input', () => {
    stopPlayback();
    saveCurrentState();
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
        renderSentences();
    }, 400);
});

rateInput.addEventListener('input', e => { rateValue.textContent = `${parseFloat(e.target.value).toFixed(1)}x`; });

btnPlay.addEventListener('click', startPlayback);
btnPause.addEventListener('click', pausePlayback);
btnStop.addEventListener('click', stopPlayback);

// 초기화
loadSavedState();
updateLanguage(currentLang, false);
</script>
</body>
</html>
